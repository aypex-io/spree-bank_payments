en:
  activemodel:
    errors:
      messages:
        must_be_store_bank_transfer: "must be one of this store's bank transfer payment methods"
  spree:
    permissions_catalog:
      resources:
        bank_payments:
          label: "Bank transfers"
          description: "The unmatched-transfers queue, recording received transfers, applying them to orders, and bank accounts."
    bank_payments:
      gateway_name: "Bank transfer"
      gateway_description: "Customers pay by bank transfer, quoting a unique reference. Incoming transfers are matched to orders automatically, or queued for staff."
      errors:
        session_required: "Bank transfer payments are taken through a payment session."
        already_applied: "This transfer has already been applied."
        gateway_mismatch: "This transfer arrived on a different bank transfer payment method and cannot be applied to this session."
        amount_mismatch: "The transfer and the session are for different amounts. Confirm to apply it anyway; the order is credited for what arrived."
        synced_account: "This account is synced from the provider: sync to refresh it, and deactivate it rather than delete it."
        sync_empty: "The sync was refused (%{reason}). No accounts were changed."
        session_closed: "This bank transfer quote is no longer valid. Please choose bank transfer again."
        capture_only_by_transfer: "A bank transfer payment is captured when the transfer is applied to it."
        session_already_paid: "This bank transfer session has already been paid."
        order_not_placed: "This bank transfer's order was never placed, so there is nothing to apply it to."
      discount_label: "Bank Transfer discount (%{percent}%)"
      payment_method_label: "Bank Transfer — save %{percent}%"
      mailer:
        # I18n.l formats: the deadline is shown in the store's time zone.
        deadline_time_format: "%-d %B %Y, %H:%M %Z"
        deadline_date_format: "%-d %B %Y"
        cancel_warning: "If we don’t receive it by then, we’ll cancel the order."
        instructions:
          subject: "%{store} Bank transfer details for order #%{number}"
          heading: "Pay by bank transfer"
          lead: "Thanks for your order #%{number}. To complete it, please transfer %{amount} by %{deadline}, quoting your payment reference."
        reminder:
          subject: "%{store} Reminder: pay for order #%{number} by %{deadline}"
          heading: "Your bank transfer is due"
          lead: "We haven’t received your bank transfer for order #%{number} yet. Please transfer %{amount} by %{deadline}, quoting your payment reference, or we’ll cancel the order."
          already_sent: "If you’ve already sent it, thank you: a transfer can take a few days to arrive."
        expired:
          subject: "%{store} Order #%{number} cancelled: bank transfer not received"
          heading: "Your order has been cancelled"
          lead: "We didn’t receive your bank transfer of %{amount} for order #%{number} by %{deadline}, so we’ve cancelled the order."
          already_sent: "If you’ve already sent the transfer, reply to this email and we’ll sort it out."
      dispatch_note: "Your order is dispatched once funds clear."
      reference: "Payment reference"
      reference_help: "Please quote this reference exactly, or we may not be able to match your payment."
      amount_to_transfer: "Amount to transfer"
      copy: "Copy"
      copied: "Copied!"
      transfer_by: "Transfer by"
      account_name: "Account name"
      beneficiary: "Beneficiary"
      iban: "IBAN"
      bic: "BIC"
      sort_code: "Sort code"
      account_number: "Account number"
